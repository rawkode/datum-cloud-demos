# Video 04 · Make safe changes to Datum
#
# On every pull request that touches the demo manifests, run the same two
# preview steps the video teaches and post the result on the PR:
#
#   datumctl diff -f manifests/                  what would change
#   datumctl apply -f manifests/ --dry-run=server would the server accept it
#
# Nothing is applied. Configure in the repo settings:
#   secret    DATUM_SA_CREDENTIALS  service account key JSON (raw or base64)
#   variable  DATUM_PROJECT         project to diff against
#   variable  DEMO_DOMAIN           optional, replaces example.com like demo.sh

name: "04 · datum diff"

on:
  pull_request:
    paths:
      - "04-make-safe-changes-to-datum/manifests/**"
      - ".github/workflows/04-datum-diff.yaml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: datum-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    env:
      DATUM_PROJECT: ${{ vars.DATUM_PROJECT }}
      DEMO_DOMAIN: ${{ vars.DEMO_DOMAIN || 'example.com' }}
    defaults:
      run:
        working-directory: 04-make-safe-changes-to-datum
    steps:
      - uses: actions/checkout@v6

      - name: Setup datumctl
        uses: datum-cloud/setup-datumctl-action@v1
        with:
          version: v0.19.0
          credentials: ${{ secrets.DATUM_SA_CREDENTIALS }}

      # Same substitution demo.sh does, so CI diffs what the demo applies.
      - name: Render manifests
        run: |
          mkdir -p "$RUNNER_TEMP/manifests"
          for f in manifests/*.yaml; do
            sed "s/example\.com/${DEMO_DOMAIN}/g" "$f" > "$RUNNER_TEMP/manifests/$(basename "$f")"
          done

      # Exit 0: no changes. 1: changes. >1: error, and the job fails.
      - name: datumctl diff
        id: diff
        run: |
          set +e
          datumctl diff -f "$RUNNER_TEMP/manifests/" --project "$DATUM_PROJECT" > "$RUNNER_TEMP/diff.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/diff.txt"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          test "$code" -le 1

      - name: datumctl apply --dry-run=server
        id: dryrun
        if: ${{ !cancelled() && steps.diff.outcome != 'skipped' }}
        run: |
          set -o pipefail
          datumctl apply -f "$RUNNER_TEMP/manifests/" --project "$DATUM_PROJECT" --dry-run=server 2>&1 \
            | tee "$RUNNER_TEMP/dryrun.txt"

      - name: Comment on PR
        if: ${{ !cancelled() && steps.diff.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DIFF_EXIT: ${{ steps.diff.outputs.exit }}
          DRYRUN: ${{ steps.dryrun.outcome }}
        run: |
          marker="<!-- datum-diff:04 -->"
          case "$DIFF_EXIT" in
            0) diff_status="No changes. Live state matches the manifests." ;;
            1) diff_status="Changes to apply." ;;
            *) diff_status="diff failed (exit $DIFF_EXIT)." ;;
          esac
          case "$DRYRUN" in
            success) dry_status="✅ Server accepted the change." ;;
            *)       dry_status="❌ Server rejected the change." ;;
          esac
          lang="diff"; [ "$DIFF_EXIT" -gt 1 ] && lang="text"

          body="$RUNNER_TEMP/comment.md"
          {
            echo "$marker"
            echo "### \`datumctl diff\` · project \`$DATUM_PROJECT\`"
            echo
            echo "$diff_status"
            if [ -s "$RUNNER_TEMP/diff.txt" ]; then
              echo
              echo "\`\`\`$lang"
              # Drop the "diff -u -N /tmp/..." lines and shorten the temp paths.
              sed -E -e '/^diff -u -N /d' \
                -e 's#^(---|\+\+\+) [^[:space:]]*/(LIVE|MERGED)-[0-9]+/([^[:space:]]+).*#\1 \2/\3#' \
                "$RUNNER_TEMP/diff.txt" | head -c 50000
              echo "\`\`\`"
            fi
            echo
            echo "### \`datumctl apply --dry-run=server\`"
            echo
            echo "$dry_status"
            echo
            echo "\`\`\`text"
            head -c 10000 "$RUNNER_TEMP/dryrun.txt" 2>/dev/null
            echo "\`\`\`"
            echo
            echo "<sub>Commit ${GITHUB_SHA::7} · nothing was applied</sub>"
          } > "$body"

          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$body" > /dev/null
          else
            gh pr comment "$PR" --body-file "$body"
          fi
